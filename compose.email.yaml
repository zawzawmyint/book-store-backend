services:
  redis:
    image: redis:8.2.10-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    ports: ['127.0.0.1:6379:6379']
    volumes: [email-redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  email-redis:
